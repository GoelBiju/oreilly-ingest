<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Font substitutions for PDF output, installed as /etc/fonts/local.conf.

  Book stylesheets name the fonts they want but do not ship them. This maps
  the names they use onto the fonts installed in the image. The PDF plugin
  prints what every request resolves to before rendering ("[pdf] font ..."),
  so check that output when adding a font or an alias here.
-->
<fontconfig>
  <!--
    O'Reilly's stylesheet asks for the bold and italic cuts of Ubuntu Mono as
    separate families, and sets the weight and style alongside.
  -->
  <alias binding="same">
    <family>Ubuntu Mono Bold</family>
    <accept><family>Ubuntu Mono</family></accept>
  </alias>
  <alias binding="same">
    <family>Ubuntu Mono Ital</family>
    <accept><family>Ubuntu Mono</family></accept>
  </alias>
  <alias binding="same">
    <family>Ubuntu Mono BoldItal</family>
    <accept><family>Ubuntu Mono</family></accept>
  </alias>

  <!--
    Open stand-ins for proprietary fonts that books commonly ask for and
    fontconfig has no built-in substitute for. Palatino, Century Schoolbook,
    Helvetica and Times are already mapped to the URW fonts by fontconfig.
  -->
  <alias binding="same">
    <family>Consolas</family>
    <accept><family>Inconsolata</family></accept>
  </alias>
  <alias binding="same">
    <family>Century Gothic</family>
    <accept><family>URW Gothic</family></accept>
  </alias>

  <!--
    Keep the generic families fixed. Without this their meaning changes
    whenever a font package is added to the image.
  -->
  <alias>
    <family>serif</family>
    <prefer><family>DejaVu Serif</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>DejaVu Sans</family></prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer><family>DejaVu Sans Mono</family></prefer>
  </alias>
</fontconfig>
